name: 龙湖天街每日签到

on:
  schedule:
    # 多时段策略：08:30 主签到，14:00 兜底重试
    # GitHub Actions cron 有延迟/跳过风险，双时段确保不漏签
    # 脚本会自动判断"今日已签到"并静默退出，不会重复推送
    - cron: '30 0 * * *'   # 北京 08:30（主）
    - cron: '0 6 * * *'    # 北京 14:00（兜底）
  workflow_dispatch: # 允许手动触发

# 同一时间只允许一个签到任务运行，避免并发冲突
concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 最小权限原则
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到
        env:
          LHTJ_TOKEN: ${{ secrets.LHTJ_TOKEN }}
          LHTJ_USERTOKEN: ${{ secrets.LHTJ_USERTOKEN }}
          LHTJ_DXRISK_TOKEN: ${{ secrets.LHTJ_DXRISK_TOKEN }}
          LHTJ_COOKIE: ${{ secrets.LHTJ_COOKIE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          LHTJ_ACTIVITY_NO: ${{ secrets.LHTJ_ACTIVITY_NO }} # 可选，不配置则用默认活动号
          LHTJ_CAPTCHA_TOKEN: ${{ secrets.LHTJ_CAPTCHA_TOKEN }} # 可选，过滑块验证后才需要
        run: python checkin.py

  # 签到失败 → 触发 Playwright 兜底方案（两方案并存策略）
  trigger-fallback:
    needs: checkin
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 触发 Playwright 兜底工作流
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ 未配置 GH_PAT Secret，无法自动触发 Playwright 兜底"
            echo "请创建 Personal Access Token (repo + workflow 权限) 并存为 GH_PAT Secret"
            exit 0
          fi
          echo "🤖 API 签到失败，触发 Playwright 兜底..."
          gh workflow run playwright.yml \
            -R "${{ github.repository }}" \
            -f reason="API签到失败自动触发"
          echo "✅ 已触发 Playwright 兜底工作流"

  # 签到失败时自动创建 Issue 告警（红色 ✗ 才触发）
  alert:
    needs: checkin
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 创建告警 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            // 查找是否已有同日告警 Issue，避免重复
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: '签到告警',
              state: 'open'
            });
            const exists = issues.data.find(i => i.title.includes(date));
            if (exists) {
              console.log(`今日告警 Issue 已存在: ${exists.html_url}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 签到失败告警 - ${date}`,
              body: [
                '签到任务执行失败，可能原因：',
                '',
                '1. **Token 过期** — 重新抓包更新 Secrets（最常见）',
                '2. **activity_no 过期** — 重新抓包获取新签到活动号，更新 LHTJ_ACTIVITY_NO',
                '3. **风控触发** — 手动进小程序签到一次过滑块',
                '4. **网络异常** — 通常会自动重试，连续失败才告警',
                '',
                '🤖 **Playwright 兜底方案已自动触发**（如已配置 GH_PAT），稍后查看运行结果。',
                '',
                '👉 [查看运行日志](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions)',
                '',
                '修复后请关闭此 Issue。'
              ].join('\n'),
              labels: ['签到告警']
            });
