name: diag-flow
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
      - name: 浏览器签到流程诊断
        env:
          LHTJ_TOKEN: ${{ secrets.LHTJ_TOKEN }}
          LHTJ_USERTOKEN: ${{ secrets.LHTJ_USERTOKEN }}
          LHTJ_COOKIE: ${{ secrets.LHTJ_COOKIE }}
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python diag_flow.py
